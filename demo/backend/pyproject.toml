[project]
name = "daari-demo-backend"
version = "0.1.0"
description = "DAARI localhost demo — one engine (roadmap + diff + job match), no network, no Docker"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
