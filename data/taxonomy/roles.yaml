# data/taxonomy/roles.yaml — DAARI role/occupation seed (P2, task T0).
#
# 11 roles: two original, fully role-cited demo paths plus nine practical
# composite paths. The composite paths are deliberately built only from skills
# that already have an independently verifiable source in skills.yaml. This
# makes every selected goal usable by the roadmap engine without pretending
# that a new occupation-level qualification pack was reviewed for each title.
#
# `required_skills` is a list of {skill_id, level} entries; each skill_id
# must exist in skills.yaml, level is the depth (1-5) that role requires.
# Growth to 40 roles is P3+ data-lane work (data.md).

- id: data_analyst
  label_en: "Data Analyst"
  label_te: "డేటా అనలిస్ట్"
  label_hi: "डेटा विश्लेषक"
  source: "ESCO occupation: data analyst — http://data.europa.eu/esco/occupation/d3edb8f8-3a06-47a0-8fb9-9b212c006aa2 (ISCO-08 group 2511); exact NCO-2015 numeric code could not be independently verified this session (ncs.gov.in's occupation search did not return a readable match) — the ESCO/ISCO citation is used instead of guessing a code."
  required_skills:
    - skill_id: spoken_english
      level: 2
    - skill_id: basic_numeracy
      level: 2
    - skill_id: digital_literacy
      level: 2
    - skill_id: ms_excel_basic
      level: 2
    - skill_id: excel_advanced
      level: 3
    - skill_id: database_fundamentals
      level: 2
    - skill_id: sql_querying
      level: 3
    - skill_id: python_programming
      level: 4
    - skill_id: statistics_fundamentals
      level: 3
    - skill_id: data_cleaning
      level: 3
    - skill_id: data_visualization_tableau
      level: 3
    - skill_id: data_visualization_powerbi
      level: 3
    - skill_id: critical_thinking_problem_solving
      level: 3

