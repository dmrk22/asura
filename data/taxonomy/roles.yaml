# data/taxonomy/roles.yaml — DAARI role/occupation seed (P2, task T0).
#
# 2 roles for the P2 seed (D17, docs/DECISIONS.md): Priya -> Data Analyst
# (fixed by DAARI_BUILD_PLAN.md §9), Ravi -> Delivery Executive (a local gig
# role picked from §7.6's list: delivery/retail/driver/technician/tailor —
# chosen because it has the strongest verifiable NSQF Qualification Pack
# coverage of the five options, LSC/Q3023 "Courier Delivery Executive").
#
# `required_skills` is a list of {skill_id, level} entries; each skill_id
# must exist in skills.yaml, level is the depth (1-5) that role requires.
# Growth to 40 roles is P3+ data-lane work (data.md).

