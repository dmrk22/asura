# data/items/items.yaml — DAARI CAT item bank seed (P2, task T0b).
#
# Full scale (data.md): >= 8 items x 3 difficulty bands (b in {-1,0,+1}) for
# the 12 demo-role skills, plus 60 generic items. This is the P2 seed: >= 8
# items spanning all three bands for 2 of skills.yaml's skills (one per demo
# role: sql_querying for Priya/Data Analyst, two_wheeler_riding for
# Ravi/Delivery Executive), plus exactly 8 generic items (spoken_english,
# basic_numeracy, digital_literacy) as task T0b specifies.
#
# Interpretation note (stated, not hidden, per data.md): ">= 8 items x 3
# bands" is read here as ">= 8 items total per skill, spanning all three
# bands" (3 items per band below) rather than "8 items PER band" (which would
# be 24 items/skill) — every other data.md number was scaled down for this
# seed too (300 -> 24 skills, 60 -> 8 generic), and no test in this phase
# (packages/core/tests/test_taxonomy.py, test_graph.py, test_profile.py)
# consumes items.yaml; CAT itself (daari_core.assess) is a later task
# (T10/T11), not in this builder's scope.
#
# DIFFICULTY BANDS ARE STATED ASSUMPTIONS, NOT EMPIRICAL CALIBRATIONS
# (data.md, explicit requirement). b = -1 (easier), 0 (medium), +1 (harder)
# reflect this author's judgment of question difficulty, not IRT-fitted
# parameters from real respondent data.
#
# Each item carries a source (the same citation as the parent skill node in
# skills.yaml, for topical grounding) or a stated rationale for its band
# placement. Two road-safety items (two_wheeler_004, two_wheeler_007) name a
# specific legal figure (minimum age, penalty) that was NOT independently
# re-verified against the primary legal text in this session -- flagged
# for data-lane fact-check before this item bank is used to score anyone.

