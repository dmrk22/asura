- id: sql_007
  skill_id: sql_querying
  band: 1
  text: "How does HAVING differ from WHERE when used with GROUP BY?"
  answer: "HAVING filters groups after aggregation; WHERE filters individual rows before aggregation."
  source: "ESCO skill: SQL — http://data.europa.eu/esco/skill/598de5b0-5b58-4ea7-8058-a4bc4d18c742"

- id: sql_008
  skill_id: sql_querying
  band: 1
  text: "Without using LIMIT/OFFSET, write a query pattern to find the second-highest salary in an `employees(salary)` table."
  answer: "SELECT MAX(salary) FROM employees WHERE salary < (SELECT MAX(salary) FROM employees)"
  source: "ESCO skill: SQL — http://data.europa.eu/esco/skill/598de5b0-5b58-4ea7-8058-a4bc4d18c742"

- id: sql_009
  skill_id: sql_querying
  band: 1
  text: "What is a self-join, and name one real scenario where you'd use one."
  answer: "A table joined to itself, e.g. to compare an employee's row to their manager's row within the same employees table."
  source: "ESCO skill: SQL — http://data.europa.eu/esco/skill/598de5b0-5b58-4ea7-8058-a4bc4d18c742"

