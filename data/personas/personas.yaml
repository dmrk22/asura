# rules/safety.md: "Synthetic personas only. Real live leads, fake people."
# No real person's data enters this repo. These two are the demo personas
# fixed by DAARI_BUILD_PLAN.md §9.4, plus a blank.
#
# `held` maps a real taxonomy skill id -> the level reached (1-5). Levels are
# stated self-assessments at this stage; P2's CAT (daari_core.assess) replaces
# them with an estimate and an error bar, and the matcher then uses the
# estimate's lower bound rather than the number below.

