services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nadi-postgres
    environment:
      POSTGRES_USER: nadi
      POSTGRES_PASSWORD: nadi
      POSTGRES_DB: nadi
    ports: ["5432:5432"]
    volumes: ["nadi_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadi -d nadi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: nadi-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["nadi_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nadi_pg:
  nadi_redis:
