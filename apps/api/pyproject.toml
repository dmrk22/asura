[project]
name = "nadi"
version = "0.1.0"
description = "NADI by Team ASURA — holistic health agent: router, triage, constraints, meals, vitals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "fastembed>=0.8.0",
    "river>=0.26.1",
    "google-genai>=2.24.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "hypothesis>=6.168.0",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nadi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["nadi", "tests"]
