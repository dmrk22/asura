[project]
name = "daari-core"
version = "0.1.0"
description = "DAARI shared engine (daari_core) — pure, deterministic. Both persona routes import this."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "networkx==3.6.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.0",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daari_core"]
