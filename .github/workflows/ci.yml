name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nadi
          POSTGRES_PASSWORD: nadi
          POSTGRES_DB: nadi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nadi -d nadi"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nadi:nadi@localhost:5432/nadi
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: lint
        run: uv run ruff check .
      - name: types
        run: uv run pyright
      - name: migrations
        run: uv run alembic upgrade head
      - name: tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: types
        run: pnpm typecheck
      - name: build
        run: pnpm build

  # The safety gate. A red eval here blocks the merge and the deploy — see CLAUDE.md #1.
  evals:
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nadi
          POSTGRES_PASSWORD: nadi
          POSTGRES_DB: nadi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nadi -d nadi"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://nadi:nadi@localhost:5432/nadi
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install
        run: uv sync --group dev
        working-directory: apps/api
      - name: run evals
        id: evals
        run: |
          if [ ! -f ../../evals/run.py ]; then
            echo "evals/run.py not written yet (lands in P2) — skipping"; exit 0
          fi
          uv run python ../../evals/run.py
        working-directory: apps/api
      - name: commit report on main
        if: github.ref == 'refs/heads/main' && hashFiles('evals/report.json') != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/report.json
          git diff --staged --quiet || (git commit -m "chore: eval report [skip ci]" && git push)
